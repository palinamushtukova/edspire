<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Лаборант — мини-игра EdSpire</title>
<meta name="description" content="Мини-игра на скорость: сортируй кислоты, оксиды, соли и основания по бакетам, пока не истекло время анализа.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&family=IBM+Plex+Mono:wght@600&display=swap">
<style>
  :root {
    --sky-top: #66c2f2;
    --sky-bot: #bfe9fb;
    --hill: #3fbb7c;
    --hill-dk: #2f9f66;
    --card: #ffffff;
    --ink: #1f3a3a;
    --muted: #5c7d78;
    --acid: #ff6259;
    --oxide: #ffb03b;
    --salt: #2ad9a8;
    --base: #4a90f4;
    --warn: #ff4b4b;
    --salt-ink: #0f9a73;
    --warn-ink: #e23a3a;
    --oxide-ink: #c97a12;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    color: var(--ink);
    font-family: 'Nunito', system-ui, sans-serif;
    padding: 20px 16px 32px;
    background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bot) 62%, var(--sky-bot) 100%);
    position: relative;
    overflow-x: hidden;
  }

  .bg-hill { position: fixed; left: -15%; right: -15%; bottom: -70px; height: 170px; background: var(--hill); border-radius: 50%; z-index: 0; pointer-events: none; }
  .bg-hill.h2 { background: var(--hill-dk); height: 110px; bottom: -90px; opacity: .85; }
  .bg-cloud { position: fixed; background: #fff; border-radius: 50px; opacity: .8; z-index: 0; pointer-events: none; animation: drift 26s ease-in-out infinite; }
  .bg-cloud.c1 { width: 70px; height: 24px; top: 8%; left: 6%; }
  .bg-cloud.c2 { width: 50px; height: 18px; top: 16%; right: 8%; animation-delay: -8s; }
  @keyframes drift { 0%,100% { transform: translateX(0); } 50% { transform: translateX(14px); } }

  .wrap { max-width: 480px; margin: 0 auto; position: relative; z-index: 1; }

  .lang-toggle {
    position: fixed; top: 14px; right: 14px; z-index: 30;
    font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 12px;
    color: var(--base); background: var(--card); border: none;
    padding: 7px 13px; border-radius: 999px; cursor: pointer;
    box-shadow: 0 3px 0 #dfeaea, 0 5px 10px rgba(20,40,30,.16);
    transition: transform .08s;
  }
  .lang-toggle:active { transform: translateY(2px); }

  /* ---------- HUD ---------- */
  .hud {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 14px;
    background: var(--card);
    border-radius: 18px;
    box-shadow: 0 4px 0 rgba(20,40,30,.10), 0 6px 14px rgba(20,40,30,.12);
    margin-bottom: 12px;
  }
  .hud-brand {
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.02em;
    color: var(--base);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .hud-brand svg { width: 20px; height: 20px; flex: none; }
  .level-pill {
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: 11px;
    color: #fff;
    background: color-mix(in srgb, var(--oxide) 72%, black 22%);
    padding: 4px 10px;
    border-radius: 999px;
    box-shadow: 0 2px 0 color-mix(in srgb, var(--oxide) 50%, black 40%);
    white-space: nowrap;
  }
  .hud-mid {
    display: flex;
    align-items: baseline;
    gap: 4px;
    font-family: 'IBM Plex Mono', monospace;
    font-variant-numeric: tabular-nums;
  }
  .hud-score { font-size: 19px; font-weight: 600; color: var(--ink); }
  .hud-combo { font-size: 12px; font-weight: 700; color: var(--oxide-ink); min-width: 26px; }
  .lives { display: flex; gap: 4px; }
  .lives svg { width: 17px; height: 17px; transition: opacity .25s, transform .25s; }
  .lives svg.spent { opacity: 0.2; transform: scale(0.8); }

  /* ---------- MASCOT ---------- */
  .mascot-row { display: flex; justify-content: center; margin-bottom: 6px; }
  .mascot { position: relative; width: 84px; height: 84px; animation: mbob 2.6s ease-in-out infinite; }
  .mascot-arm { position: absolute; top: 40px; width: 9px; height: 24px; background: #ffe2b0; border-radius: 6px; z-index: -1; }
  .mascot-arm.l { left: -3px; transform: rotate(18deg); }
  .mascot-arm.r { right: -3px; transform: rotate(-18deg); }
  .mascot-neck { width: 18px; height: 12px; margin: 0 auto; background: #eaf7ff; border-radius: 5px 5px 0 0; }
  .mascot-body {
    position: relative; width: 78px; height: 66px; margin: -2px auto 0;
    background: #eaf7ff;
    border-radius: 44% 44% 40% 40% / 58% 58% 42% 42%;
    box-shadow: 0 4px 0 #cfe9f5, 0 7px 12px rgba(20,40,30,.16);
    overflow: hidden;
  }
  .mascot-liquid {
    position: absolute; left: 0; right: 0; bottom: 0; height: 46%;
    background: linear-gradient(180deg, color-mix(in srgb, var(--salt) 60%, transparent), color-mix(in srgb, var(--salt) 92%, black 6%));
  }
  .mascot-bubble { position: absolute; border-radius: 50%; background: rgba(255,255,255,.6); width: 5px; height: 5px; bottom: 8%; animation: mbubble 2.8s ease-in infinite; }
  .mascot-bubble.b1 { left: 30%; animation-delay: .2s; }
  .mascot-bubble.b2 { left: 58%; width: 3px; height: 3px; animation-delay: 1.1s; }
  .cheek { position: absolute; top: 30px; width: 8px; height: 6px; border-radius: 50%; background: #ffb0a0; opacity: .7; }
  .cheek.l { left: 8px; } .cheek.r { right: 8px; }
  .eye { position: absolute; top: 22px; width: 8px; height: 8px; border-radius: 50%; background: var(--ink); transition: transform .15s, height .15s, top .15s, border-radius .15s; }
  .eye-l { left: 22px; } .eye-r { right: 22px; }
  .mouth { position: absolute; top: 37px; left: 50%; transform: translateX(-50%); width: 18px; height: 9px; border-bottom: 3px solid var(--ink); border-radius: 0 0 50% 50%; transition: all .15s; }
  @keyframes mbob { 0%,100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-4px) rotate(-1.5deg); } }
  @keyframes mbubble { 0% { transform: translateY(0); opacity: .7; } 80% { opacity: .3; } 100% { transform: translateY(-26px); opacity: 0; } }

  .mascot.mood-happy { animation: mjump .4s ease; }
  .mascot.mood-happy .eye { height: 3px; top: 24px; border-radius: 3px; }
  .mascot.mood-happy .mouth { width: 24px; height: 12px; }
  @keyframes mjump { 0% { transform: scale(1); } 35% { transform: scale(1.06,0.9) translateY(2px); } 60% { transform: scale(0.95,1.08) translateY(-6px); } 100% { transform: scale(1); } }

  .mascot.mood-sad { animation: mwobble .45s ease; }
  .mascot.mood-sad .eye { top: 24px; transform: scaleY(0.6); }
  .mascot.mood-sad .mouth { border-bottom: none; border-top: 3px solid var(--warn); border-radius: 50% 50% 0 0; top: 44px; }
  @keyframes mwobble { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-6deg); } 75% { transform: rotate(6deg); } }

  .mascot.mood-over { animation: none; transform: rotate(4deg) translateY(4px); }
  .mascot.mood-over .eye { height: 2px; top: 25px; border-radius: 2px; }
  .mascot.mood-over .mouth { width: 12px; height: 2px; border-bottom: none; background: var(--muted); border-radius: 2px; top: 39px; }

  /* ---------- LEVEL-UP BANNER ---------- */
  .levelup {
    position: fixed; top: 18px; left: 50%; transform: translate(-50%, -60px);
    font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 16px; color: #fff;
    background: var(--base); padding: 10px 20px; border-radius: 999px;
    box-shadow: 0 4px 0 color-mix(in srgb, var(--base) 65%, black 25%), 0 8px 16px rgba(0,0,0,.2);
    z-index: 20; opacity: 0; pointer-events: none;
  }
  .levelup.show { animation: levelup 1.4s ease forwards; }
  @keyframes levelup {
    0% { opacity: 0; transform: translate(-50%, -60px); }
    15% { opacity: 1; transform: translate(-50%, 12px); }
    80% { opacity: 1; transform: translate(-50%, 12px); }
    100% { opacity: 0; transform: translate(-50%, -20px); }
  }

  /* ---------- ARENA ---------- */
  .arena {
    position: relative;
    aspect-ratio: 1 / 1;
    width: 100%;
    display: grid;
    grid-template-columns: 1fr 1.5fr 1fr;
    grid-template-rows: 1fr 1.5fr 1fr;
    gap: 8px;
    user-select: none;
    touch-action: none;
  }
  .zone {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 6px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: transform .12s;
    text-align: center;
  }
  .zone:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; border-radius: 12px; }
  .zone-arrow { width: 13px; height: 13px; color: var(--muted) !important; opacity: .65; }
  .zone-bucket {
    position: relative;
    width: 48px; height: 44px;
    border-radius: 10px 10px 16px 16px;
    background: var(--zc);
    box-shadow: 0 4px 0 var(--zcd), 0 7px 12px rgba(20,40,30,.16);
    transition: transform .12s, box-shadow .12s;
    animation: bwiggle 3.6s ease-in-out infinite;
  }
  .zone-bucket::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 22%;
    background: color-mix(in srgb, var(--zc) 40%, white 45%);
    border-radius: 10px 10px 0 0;
  }
  .bface { position: absolute; left: 0; right: 0; top: 22px; display: flex; justify-content: center; gap: 10px; }
  .bface i { width: 5px; height: 5px; border-radius: 50%; background: rgba(20,30,25,.75); display: block; }
  .bmouth { position: absolute; left: 50%; top: 31px; transform: translateX(-50%); width: 10px; height: 5px; border-bottom: 2.5px solid rgba(20,30,25,.75); border-radius: 0 0 50% 50%; }
  @keyframes bwiggle { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(3deg); } }
  .zone-label { font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 12px; letter-spacing: 0.02em; color: var(--ink); }
  .zone.flash .zone-bucket { animation: none; transform: scale(1.16,0.86) translateY(-2px); }
  .splash-dot { position: absolute; width: 6px; height: 6px; border-radius: 50%; background: var(--zc); pointer-events: none; animation: splash .55s ease-out forwards; }
  @keyframes splash {
    0% { transform: translate(-50%,-50%) scale(1); opacity: 1; }
    100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(0.3); opacity: 0; }
  }
  .z-up    { grid-column: 2; grid-row: 1; }
  .z-left  { grid-column: 1; grid-row: 2; }
  .z-right { grid-column: 3; grid-row: 2; }
  .z-down  { grid-column: 2; grid-row: 3; }

  .stage { grid-column: 2; grid-row: 2; position: relative; display: flex; align-items: center; justify-content: center; }
  .ring { position: absolute; inset: 0; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 6; }
  .ring .track { stroke: rgba(255,255,255,.6); }
  .ring .bar { stroke: var(--salt); stroke-linecap: round; transition: stroke .3s; }

  .card {
    position: relative;
    width: 72%; height: 72%;
    border-radius: 50%;
    background: var(--card);
    box-shadow: 0 5px 0 #dfeaea, 0 9px 16px rgba(20,40,30,.18);
    display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 10px;
  }
  .card-formula { font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: clamp(19px, 6vw, 25px); line-height: 1.15; color: var(--ink); }
  .card-formula sub { font-size: 0.62em; }
  .card.shake { animation: shake .32s; }
  .card.pop { animation: pop .32s; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  @keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.08); } 100% { transform: scale(1); } }

  .toast {
    position: absolute; bottom: -6px; left: 50%; transform: translate(-50%, 100%);
    font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 12px; white-space: nowrap;
    padding: 5px 11px; border-radius: 999px; background: var(--card);
    box-shadow: 0 3px 0 #dfeaea, 0 5px 8px rgba(20,40,30,.14);
    opacity: 0; pointer-events: none;
  }
  .toast.show { animation: toastup .8s ease forwards; }
  @keyframes toastup {
    0% { opacity: 0; transform: translate(-50%, 100%); }
    18% { opacity: 1; transform: translate(-50%, 130%); }
    75% { opacity: 1; transform: translate(-50%, 130%); }
    100% { opacity: 0; transform: translate(-50%, 150%); }
  }

  .foot { margin-top: 14px; text-align: center; color: var(--muted); font-size: 12px; line-height: 1.5; font-weight: 700; }
  .foot b { color: var(--ink); }

  /* ---------- OVERLAYS ---------- */
  .overlay {
    position: fixed; inset: 0; background: rgba(20,50,45,.35); backdrop-filter: blur(3px);
    display: flex; align-items: center; justify-content: center; padding: 20px 16px; z-index: 10;
  }
  .panel-card {
    width: 100%; max-width: 380px; background: var(--card); border-radius: 24px;
    box-shadow: 0 6px 0 #dfeaea, 0 14px 30px rgba(20,40,30,.22);
    padding: 26px 24px 24px; text-align: center;
  }
  .panel-card h1 { font-family: 'Fredoka', sans-serif; font-size: 28px; font-weight: 700; margin: 6px 0 4px; text-wrap: balance; color: var(--base); }
  .panel-card .sub { color: var(--muted); font-size: 13.5px; margin: 0 0 18px; line-height: 1.55; font-weight: 600; }
  .legend { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 20px; }
  .legend-item {
    background: #f4faf9; border-radius: 12px; padding: 10px 8px;
    display: flex; align-items: center; justify-content: center; gap: 7px;
  }
  .legend-item i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; flex: none; }
  .legend-item span { font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 12.5px; }

  .stat-row { display: flex; justify-content: center; gap: 22px; margin-bottom: 20px; font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; }
  .stat-row .stat b { display: block; font-size: 25px; font-weight: 600; }
  .stat-row .stat span { font-size: 10px; color: var(--muted); letter-spacing: 0.06em; font-family: 'Nunito', sans-serif; font-weight: 800; }
  .stat-row .stat.new b { color: var(--salt-ink); }

  .review { text-align: left; margin-bottom: 18px; padding-top: 14px; border-top: 2px dashed #e4eeee; }
  .review-title { font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 12.5px; color: var(--muted); margin-bottom: 8px; }
  .review-list { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .review-chip {
    display: inline-flex; align-items: center; gap: 7px;
    background: #f4faf9; border-radius: 10px; padding: 6px 10px 6px 8px;
  }
  .review-chip i { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .review-chip .rc-body { display: flex; flex-direction: column; line-height: 1.25; }
  .review-chip b { font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 11.5px; color: var(--ink); font-style: normal; }
  .review-chip em { font-size: 10px; color: var(--muted); font-weight: 800; font-style: normal; letter-spacing: 0.02em; }
  .review-more { font-size: 11.5px; color: var(--muted); font-weight: 700; align-self: center; }
  .review-tip { font-size: 12.5px; color: var(--muted); line-height: 1.5; font-weight: 700; margin: 0; }

  .btn {
    font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 15px; letter-spacing: 0.01em;
    border: none; border-radius: 14px; padding: 13px 20px; width: 100%;
    background: var(--base); color: #ffffff; cursor: pointer;
    box-shadow: 0 5px 0 color-mix(in srgb, var(--base) 65%, black 25%);
    transition: transform .08s, box-shadow .08s;
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 color-mix(in srgb, var(--base) 65%, black 25%); }

  [hidden] { display: none !important; }

  @media (prefers-reduced-motion: reduce) {
    .card.shake, .card.pop, .toast.show, .levelup.show,
    .mascot, .mascot.mood-happy, .mascot.mood-sad,
    .mascot-bubble, .zone-bucket, .splash-dot, .bg-cloud { animation: none !important; }
    * { transition-duration: .01s !important; }
  }
</style>
</head>
<body>

<div class="bg-hill h1"></div>
<div class="bg-hill h2"></div>
<div class="bg-cloud c1"></div>
<div class="bg-cloud c2"></div>

<button class="lang-toggle" id="langToggle" type="button">EN</button>

<div class="wrap">
  <div class="hud">
    <div class="hud-brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2v6.2L4 18.5a2 2 0 0 0 1.8 2.9h12.4a2 2 0 0 0 1.8-2.9L15 8.2V2"/><path d="M9 2h6"/><path d="M7 15h10"/></svg>
      <span id="brandText">ЛАБОРАНТ</span>
    </div>
    <span class="level-pill" id="levelPill">УРОВЕНЬ 1</span>
    <div class="hud-mid">
      <span class="hud-score" id="score">0</span>
      <span class="hud-combo" id="combo"></span>
    </div>
    <div class="lives" id="lives"></div>
  </div>

  <div class="mascot-row">
    <div class="mascot" id="mascot">
      <div class="mascot-arm l"></div>
      <div class="mascot-arm r"></div>
      <div class="mascot-neck"></div>
      <div class="mascot-body">
        <div class="mascot-liquid"></div>
        <div class="mascot-bubble b1"></div>
        <div class="mascot-bubble b2"></div>
        <div class="cheek l"></div>
        <div class="cheek r"></div>
        <div class="eye eye-l"></div>
        <div class="eye eye-r"></div>
        <div class="mouth"></div>
      </div>
    </div>
  </div>

  <div class="arena" id="arena">
    <div class="zone z-up" data-dir="up" tabindex="0" role="button"></div>
    <div class="zone z-left" data-dir="left" tabindex="0" role="button"></div>
    <div class="stage">
      <svg class="ring" viewBox="0 0 100 100">
        <circle class="track" cx="50" cy="50" r="45"></circle>
        <circle class="bar" id="ringBar" cx="50" cy="50" r="45" stroke-dasharray="283"></circle>
      </svg>
      <div class="card" id="card">
        <div class="card-formula" id="formula"></div>
        <div class="toast" id="toast"></div>
      </div>
    </div>
    <div class="zone z-right" data-dir="right" tabindex="0" role="button"></div>
    <div class="zone z-down" data-dir="down" tabindex="0" role="button"></div>
  </div>

  <div class="foot"><span id="footLabel"></span> <b id="footBest">0</b></div>
</div>

<div class="levelup" id="levelUp"></div>

<div class="overlay" id="startOverlay">
  <div class="panel-card">
    <h1 id="startTitle">Лаборант</h1>
    <p class="sub" id="startSub">Мини-игра, чтобы потренироваться в классификации веществ — свайпай или жми стрелочки, чтобы отправить вещество в нужную группу, пока не истекло время анализа!</p>
    <div class="legend" id="legend"></div>
    <button class="btn" id="startBtn">Начать смену</button>
  </div>
</div>

<div class="overlay" id="endOverlay" hidden>
  <div class="panel-card">
    <h1 id="endTitle">Смена окончена</h1>
    <p class="sub" id="endReason">Три пробы забракованы — партию списали.</p>
    <div class="stat-row">
      <div class="stat"><b id="finalScore">0</b><span id="scoreLabel">ОЧКОВ</span></div>
      <div class="stat" id="bestStat"><b id="bestScore">0</b><span id="bestLabel">РЕКОРД</span></div>
    </div>
    <div class="review" id="reviewBlock" hidden>
      <div class="review-title" id="reviewTitle"></div>
      <div class="review-list" id="reviewList"></div>
      <p class="review-tip" id="reviewTip"></p>
    </div>
    <button class="btn" id="againBtn">Играть снова</button>
  </div>
</div>

<script>
(function () {
  var ARROW = {
    up: '<path d="M12 19V5"/><path d="M6 11l6-6 6 6"/>',
    down: '<path d="M12 5v14"/><path d="M6 13l6 6 6-6"/>',
    left: '<path d="M19 12H5"/><path d="M11 6l-6 6 6 6"/>',
    right: '<path d="M5 12h14"/><path d="M13 6l6 6-6 6"/>'
  };

  var ZONE_DIR = { up: 'oxide', right: 'salt', down: 'base', left: 'acid' };
  var ZONE_COLOR = { oxide: 'var(--oxide)', salt: 'var(--salt)', base: 'var(--base)', acid: 'var(--acid)' };

  /* [формула, название RU, название EN] — от самых узнаваемых веществ к каверзным;
     новые уровни открывают доступ к более сложному хвосту списка */
  var DATA = {
    acid: [
      ['HCl','соляная кислота','hydrochloric acid'], ['H<sub>2</sub>SO<sub>4</sub>','серная кислота','sulfuric acid'],
      ['HNO<sub>3</sub>','азотная кислота','nitric acid'], ['H<sub>2</sub>CO<sub>3</sub>','угольная кислота','carbonic acid'],
      ['H<sub>3</sub>PO<sub>4</sub>','фосфорная кислота','phosphoric acid'], ['H<sub>2</sub>S','сероводородная кислота','hydrosulfuric acid'],
      ['HBr','бромоводородная кислота','hydrobromic acid'], ['HI','иодоводородная кислота','hydroiodic acid'],
      ['H<sub>2</sub>SO<sub>3</sub>','сернистая кислота','sulfurous acid'], ['CH<sub>3</sub>COOH','уксусная кислота','acetic acid']
    ],
    oxide: [
      ['CO<sub>2</sub>','оксид углерода(IV)','carbon dioxide'], ['CaO','оксид кальция','calcium oxide'],
      ['MgO','оксид магния','magnesium oxide'], ['Na<sub>2</sub>O','оксид натрия','sodium oxide'],
      ['CuO','оксид меди(II)','copper(II) oxide'], ['SO<sub>2</sub>','оксид серы(IV)','sulfur dioxide'],
      ['Fe<sub>2</sub>O<sub>3</sub>','оксид железа(III)','iron(III) oxide'], ['Al<sub>2</sub>O<sub>3</sub>','оксид алюминия','aluminum oxide'],
      ['P<sub>2</sub>O<sub>5</sub>','оксид фосфора(V)','phosphorus pentoxide'], ['SO<sub>3</sub>','оксид серы(VI)','sulfur trioxide']
    ],
    salt: [
      ['NaCl','хлорид натрия','sodium chloride'], ['KNO<sub>3</sub>','нитрат калия','potassium nitrate'],
      ['CaCO<sub>3</sub>','карбонат кальция','calcium carbonate'], ['K<sub>2</sub>SO<sub>4</sub>','сульфат калия','potassium sulfate'],
      ['BaCl<sub>2</sub>','хлорид бария','barium chloride'], ['Na<sub>2</sub>CO<sub>3</sub>','карбонат натрия','sodium carbonate'],
      ['ZnSO<sub>4</sub>','сульфат цинка','zinc sulfate'], ['FeCl<sub>3</sub>','хлорид железа(III)','iron(III) chloride'],
      ['CuSO<sub>4</sub>','сульфат меди(II)','copper(II) sulfate'], ['AgNO<sub>3</sub>','нитрат серебра','silver nitrate']
    ],
    base: [
      ['NaOH','гидроксид натрия','sodium hydroxide'], ['KOH','гидроксид калия','potassium hydroxide'],
      ['Ca(OH)<sub>2</sub>','гидроксид кальция','calcium hydroxide'], ['Mg(OH)<sub>2</sub>','гидроксид магния','magnesium hydroxide'],
      ['LiOH','гидроксид лития','lithium hydroxide'], ['Ba(OH)<sub>2</sub>','гидроксид бария','barium hydroxide'],
      ['Al(OH)<sub>3</sub>','гидроксид алюминия','aluminum hydroxide'], ['Fe(OH)<sub>3</sub>','гидроксид железа(III)','iron(III) hydroxide'],
      ['Cu(OH)<sub>2</sub>','гидроксид меди(II)','copper(II) hydroxide'], ['NH<sub>4</sub>OH','гидроксид аммония','ammonium hydroxide']
    ]
  };

  var STR = {
    ru: {
      brand: 'ЛАБОРАНТ', levelPrefix: 'УРОВЕНЬ ',
      zones: { oxide: 'ОКСИД', salt: 'СОЛЬ', base: 'ОСНОВАНИЕ', acid: 'КИСЛОТА' },
      startTitle: 'Лаборант',
      startSub: 'Мини-игра, чтобы потренироваться в классификации веществ — свайпай или жми стрелочки, чтобы отправить вещество в нужную группу, пока не истекло время анализа!',
      startBtn: 'Начать смену',
      footLabel: 'стрелки / свайп / тап по бакету · рекорд смены:',
      endTitle: 'Смена окончена',
      endReasonLives: 'Три пробы забракованы — партию списали.',
      endReasonTimeout: 'Последняя проба просрочена — партию списали.',
      scoreLabel: 'ОЧКОВ', bestLabel: 'РЕКОРД', againBtn: 'Играть снова',
      levelUp: 'Уровень ', toastMiss: 'мимо', toastTimeout: 'просрочено',
      langBtn: 'EN',
      reviewTitle: 'Обрати внимание:',
      reviewMore: ' и ещё {n}',
      closers: [
        'Ещё пара смен — и рука сама будет знать, куда кидать 🙂',
        'Мозг уже запоминает эти паттерны быстрее, чем кажется — продолжай.',
        'Каждая ошибка сегодня — это формула, которую завтра узнаешь с первого взгляда.'
      ]
    },
    en: {
      brand: 'LAB', levelPrefix: 'LEVEL ',
      zones: { oxide: 'OXIDE', salt: 'SALT', base: 'BASE', acid: 'ACID' },
      startTitle: 'Lab Assistant',
      startSub: 'A quick game to practice classifying substances — swipe or hit the arrow keys to send each one to the right group before the analysis timer runs out!',
      startBtn: 'Start shift',
      footLabel: 'arrows / swipe / tap a bucket · shift best:',
      endTitle: 'Shift over',
      endReasonLives: 'Three samples rejected — batch scrapped.',
      endReasonTimeout: 'Last sample expired — batch scrapped.',
      scoreLabel: 'SCORE', bestLabel: 'BEST', againBtn: 'Play again',
      levelUp: 'Level ', toastMiss: 'wrong bin', toastTimeout: 'expired',
      langBtn: 'RU',
      reviewTitle: 'Worth a second look:',
      reviewMore: ' and {n} more',
      closers: [
        'A couple more shifts and your hand will just know where to throw these.',
        'Your brain is already picking up the patterns faster than it feels — keep going.',
        'Every miss today is a formula you\'ll spot instantly next time.'
      ]
    }
  };

  var KEYS = ['acid','oxide','salt','base'];
  var CIRC = 283;
  var LEVEL_TABLE = [
    { time: 3.4, pool: 4 },
    { time: 2.9, pool: 6 },
    { time: 2.4, pool: 8 },
    { time: 2.0, pool: 10 },
    { time: 1.7, pool: 10 },
    { time: 1.45, pool: 10 },
    { time: 1.25, pool: 10 }
  ];
  var LEVEL_THRESH = [0, 6, 14, 24, 36, 50, 66];

  var els = {
    brandText: document.getElementById('brandText'),
    score: document.getElementById('score'),
    combo: document.getElementById('combo'),
    lives: document.getElementById('lives'),
    arena: document.getElementById('arena'),
    mascot: document.getElementById('mascot'),
    card: document.getElementById('card'),
    formula: document.getElementById('formula'),
    toast: document.getElementById('toast'),
    ringBar: document.getElementById('ringBar'),
    footLabel: document.getElementById('footLabel'),
    footBest: document.getElementById('footBest'),
    legend: document.getElementById('legend'),
    levelPill: document.getElementById('levelPill'),
    levelUp: document.getElementById('levelUp'),
    langToggle: document.getElementById('langToggle'),
    startOverlay: document.getElementById('startOverlay'),
    endOverlay: document.getElementById('endOverlay'),
    startTitle: document.getElementById('startTitle'),
    startSub: document.getElementById('startSub'),
    startBtn: document.getElementById('startBtn'),
    againBtn: document.getElementById('againBtn'),
    endTitle: document.getElementById('endTitle'),
    endReason: document.getElementById('endReason'),
    finalScore: document.getElementById('finalScore'),
    bestScore: document.getElementById('bestScore'),
    bestStat: document.getElementById('bestStat'),
    scoreLabel: document.getElementById('scoreLabel'),
    bestLabel: document.getElementById('bestLabel'),
    reviewBlock: document.getElementById('reviewBlock'),
    reviewTitle: document.getElementById('reviewTitle'),
    reviewList: document.getElementById('reviewList'),
    reviewTip: document.getElementById('reviewTip')
  };

  var g = { score: 0, best: 0, lives: 3, combo: 0, correctCount: 0, level: 1, prevLevel: 1, state: 'idle',
    current: null, lastFormula: null, roundStart: 0, roundTime: 3.4, pool: 4, raf: null, lang: 'ru',
    mistakes: [], closerIdx: 0 };
  var mascotTimer = null;
  var levelUpTimer = null;

  function T() { return STR[g.lang]; }

  function readBest() {
    try { return parseInt(localStorage.getItem('laborant-best') || '0', 10) || 0; }
    catch (e) { return 0; }
  }
  function writeBest(v) {
    try { localStorage.setItem('laborant-best', String(v)); } catch (e) {}
  }
  function readLang() {
    try { return localStorage.getItem('laborant-lang') || 'ru'; }
    catch (e) { return 'ru'; }
  }
  function writeLang(v) {
    try { localStorage.setItem('laborant-lang', v); } catch (e) {}
  }

  function levelForCount(c) {
    var lvl = 1;
    for (var i = 1; i < LEVEL_THRESH.length; i++) {
      if (c >= LEVEL_THRESH[i]) lvl = i + 1; else break;
    }
    if (c >= LEVEL_THRESH[LEVEL_THRESH.length - 1]) {
      lvl = LEVEL_THRESH.length + Math.floor((c - LEVEL_THRESH[LEVEL_THRESH.length - 1]) / 18);
    }
    return lvl;
  }

  function configForLevel(lvl) {
    var idx = Math.min(lvl, LEVEL_TABLE.length) - 1;
    var base = LEVEL_TABLE[idx];
    if (lvl > LEVEL_TABLE.length) {
      return { time: Math.max(0.9, base.time - (lvl - LEVEL_TABLE.length) * 0.05), pool: 10 };
    }
    return base;
  }

  function setMood(mood, holdMs) {
    if (mascotTimer) clearTimeout(mascotTimer);
    els.mascot.classList.remove('mood-happy', 'mood-sad', 'mood-over');
    if (mood) els.mascot.classList.add('mood-' + mood);
    if (mood === 'happy' || mood === 'sad') {
      mascotTimer = setTimeout(function () { els.mascot.classList.remove('mood-' + mood); }, holdMs || 480);
    }
  }

  function showLevelUp(lvl) {
    if (levelUpTimer) clearTimeout(levelUpTimer);
    els.levelUp.textContent = T().levelUp + lvl + '!';
    els.levelUp.classList.remove('show');
    void els.levelUp.offsetWidth;
    els.levelUp.classList.add('show');
    setMood('happy', 900);
  }

  function spawnSplash(zoneEl) {
    var bucket = zoneEl.querySelector('.zone-bucket');
    var cx = bucket.offsetLeft + bucket.offsetWidth / 2;
    var cy = bucket.offsetTop + bucket.offsetHeight * 0.4;
    for (var i = 0; i < 6; i++) {
      var dot = document.createElement('div');
      dot.className = 'splash-dot';
      dot.style.left = cx + 'px';
      dot.style.top = cy + 'px';
      var angle = (Math.random() * 140 + 200) * Math.PI / 180;
      var dist = 15 + Math.random() * 13;
      dot.style.setProperty('--dx', (Math.cos(angle) * dist) + 'px');
      dot.style.setProperty('--dy', (Math.sin(angle) * dist) + 'px');
      dot.style.animationDelay = (Math.random() * 80) + 'ms';
      zoneEl.appendChild(dot);
      (function (d) { setTimeout(function () { d.remove(); }, 700); })(dot);
    }
  }

  function buildZones() {
    Object.keys(ZONE_DIR).forEach(function (dir) {
      var key = ZONE_DIR[dir];
      var color = ZONE_COLOR[key];
      var el = els.arena.querySelector('.zone[data-dir="' + dir + '"]');
      el.style.setProperty('--zc', color);
      el.style.setProperty('--zcd', 'color-mix(in srgb, ' + color + ' 70%, black 25%)');
      el.innerHTML =
        '<svg class="zone-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">' + ARROW[dir] + '</svg>' +
        '<div class="zone-bucket"><div class="bface"><i></i><i></i></div><div class="bmouth"></div></div>' +
        '<div class="zone-label" data-key="' + key + '"></div>';
      el.addEventListener('click', function () { handleDir(dir); });
      el.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); handleDir(dir); }
      });
    });
  }

  function buildLegend() {
    els.legend.innerHTML = KEYS.map(function (k) {
      return '<div class="legend-item"><i style="background:' + ZONE_COLOR[k] + '"></i><span data-key="' + k + '"></span></div>';
    }).join('');
  }

  function applyLang() {
    var t = T();
    els.brandText.textContent = t.brand;
    els.startTitle.textContent = t.startTitle;
    els.startSub.textContent = t.startSub;
    els.startBtn.textContent = t.startBtn;
    els.footLabel.textContent = t.footLabel;
    els.endTitle.textContent = t.endTitle;
    els.scoreLabel.textContent = t.scoreLabel;
    els.bestLabel.textContent = t.bestLabel;
    els.againBtn.textContent = t.againBtn;
    els.langToggle.textContent = t.langBtn;
    els.arena.querySelectorAll('.zone-label').forEach(function (elz) {
      elz.textContent = t.zones[elz.getAttribute('data-key')];
    });
    els.legend.querySelectorAll('span[data-key]').forEach(function (elz) {
      elz.textContent = t.zones[elz.getAttribute('data-key')];
    });
    if (g.state === 'gameover') {
      els.endReason.textContent = g.lastEndByTimeout ? t.endReasonTimeout : t.endReasonLives;
      renderReview();
    }
    updateHUD();
  }

  function updateHUD() {
    els.score.textContent = g.score;
    els.combo.textContent = g.combo >= 2 ? ('×' + g.combo) : '';
    els.levelPill.textContent = T().levelPrefix + g.level;
    var hearts = els.lives.children;
    for (var i = 0; i < hearts.length; i++) {
      hearts[i].classList.toggle('spent', i >= g.lives);
    }
  }

  function buildLives() {
    els.lives.innerHTML = '';
    for (var i = 0; i < 3; i++) {
      var s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      s.setAttribute('viewBox', '0 0 24 24');
      s.setAttribute('fill', 'none');
      s.setAttribute('stroke', 'var(--salt)');
      s.setAttribute('stroke-width', '2');
      s.setAttribute('stroke-linecap', 'round');
      s.setAttribute('stroke-linejoin', 'round');
      s.innerHTML = '<path d="M9 2v6.2L4 18.5a2 2 0 0 0 1.8 2.9h12.4a2 2 0 0 0 1.8-2.9L15 8.2V2"/><path d="M9 2h6"/><path d="M7 15h10"/>';
      els.lives.appendChild(s);
    }
  }

  function pickRound() {
    var key = KEYS[Math.floor(Math.random() * KEYS.length)];
    var list = DATA[key].slice(0, g.pool);
    var item;
    do { item = list[Math.floor(Math.random() * list.length)]; }
    while (item[0] === g.lastFormula && list.length > 1);
    g.lastFormula = item[0];
    return { key: key, formula: item[0], nameRu: item[1], nameEn: item[2] };
  }

  function currentName(item) { return g.lang === 'en' ? item.nameEn : item.nameRu; }

  function newRound() {
    g.level = levelForCount(g.correctCount);
    var cfg = configForLevel(g.level);
    g.roundTime = cfg.time;
    g.pool = cfg.pool;
    if (g.level > g.prevLevel) {
      g.prevLevel = g.level;
      showLevelUp(g.level);
    }
    updateHUD();

    g.current = pickRound();
    els.formula.innerHTML = g.current.formula;
    els.card.classList.remove('shake', 'pop');
    g.roundStart = performance.now();
    if (g.raf) cancelAnimationFrame(g.raf);
    g.raf = requestAnimationFrame(tick);
  }

  function tick(now) {
    var elapsed = (now - g.roundStart) / 1000;
    var frac = Math.min(1, elapsed / g.roundTime);
    els.ringBar.setAttribute('stroke-dasharray', CIRC);
    els.ringBar.setAttribute('stroke-dashoffset', CIRC * frac);
    els.ringBar.style.stroke = frac > 0.7 ? 'var(--warn)' : (frac > 0.4 ? 'var(--oxide)' : 'var(--salt)');
    if (frac >= 1) {
      resolveRound(null);
      return;
    }
    g.raf = requestAnimationFrame(tick);
  }

  function flashZone(dir, ok) {
    var el = els.arena.querySelector('.zone[data-dir="' + dir + '"]');
    el.classList.add('flash');
    if (ok) spawnSplash(el);
    setTimeout(function () { el.classList.remove('flash'); }, 260);
  }

  function showToast(text, ok) {
    els.toast.textContent = text;
    els.toast.style.color = ok ? 'var(--salt-ink)' : 'var(--warn-ink)';
    els.toast.classList.remove('show');
    void els.toast.offsetWidth;
    els.toast.classList.add('show');
  }

  function handleDir(dir) {
    if (g.state !== 'playing') return;
    resolveRound(dir);
  }

  function resolveRound(dir) {
    if (g.state !== 'playing') return;
    g.state = 'resolving';
    if (g.raf) cancelAnimationFrame(g.raf);
    var correctDir = Object.keys(ZONE_DIR).filter(function (d) { return ZONE_DIR[d] === g.current.key; })[0];
    var ok = dir === correctDir;
    var t = T();

    if (ok) {
      g.combo++;
      g.correctCount++;
      var pts = 10 + (g.combo - 1) * 2;
      g.score += pts;
      els.card.classList.add('pop');
      flashZone(dir, true);
      showToast('+' + pts + ' · ' + currentName(g.current), true);
      setMood('happy');
    } else {
      g.combo = 0;
      g.lives--;
      els.card.classList.add('shake');
      if (dir) flashZone(dir, false);
      showToast((dir ? t.toastMiss : t.toastTimeout) + ' · ' + currentName(g.current), false);
      setMood('sad');
      if (!g.mistakes.some(function (m) { return m.formula === g.current.formula; })) {
        g.mistakes.push(g.current);
      }
    }
    updateHUD();

    setTimeout(function () {
      if (g.lives <= 0) { endGame(dir === null); return; }
      g.state = 'playing';
      newRound();
    }, 520);
  }

  function startGame() {
    g.score = 0; g.lives = 3; g.combo = 0; g.correctCount = 0; g.level = 1; g.prevLevel = 1; g.lastFormula = null;
    g.mistakes = [];
    g.state = 'playing';
    setMood(null);
    els.startOverlay.hidden = true;
    els.endOverlay.hidden = true;
    newRound();
  }

  function renderReview() {
    var t = T();
    if (!g.mistakes.length) { els.reviewBlock.hidden = true; return; }
    els.reviewBlock.hidden = false;
    els.reviewTitle.textContent = t.reviewTitle;

    var shown = g.mistakes.slice(0, 4);
    var extra = g.mistakes.length - shown.length;
    var chips = shown.map(function (m) {
      return '<span class="review-chip"><i style="background:' + ZONE_COLOR[m.key] + '"></i><span class="rc-body"><b>' + currentName(m) + '</b><em>' + t.zones[m.key] + '</em></span></span>';
    }).join('');
    if (extra > 0) chips += '<span class="review-more">' + t.reviewMore.replace('{n}', extra) + '</span>';
    els.reviewList.innerHTML = chips;

    els.reviewTip.textContent = t.closers[g.closerIdx % t.closers.length];
  }

  function endGame(byTimeout) {
    g.state = 'gameover';
    g.lastEndByTimeout = byTimeout;
    setMood('over');
    if (g.raf) cancelAnimationFrame(g.raf);
    els.endReason.textContent = byTimeout ? T().endReasonTimeout : T().endReasonLives;
    els.finalScore.textContent = g.score;
    var isNew = g.score > g.best;
    if (isNew) { g.best = g.score; writeBest(g.best); }
    els.bestScore.textContent = g.best;
    els.bestStat.classList.toggle('new', isNew);
    els.footBest.textContent = g.best;
    g.closerIdx = Math.floor(Math.random() * 3);
    renderReview();
    els.endOverlay.hidden = false;
  }

  var touchStart = null;
  els.arena.addEventListener('touchstart', function (e) {
    var t = e.changedTouches[0];
    touchStart = { x: t.clientX, y: t.clientY };
  }, { passive: true });
  els.arena.addEventListener('touchend', function (e) {
    if (!touchStart) return;
    var t = e.changedTouches[0];
    var dx = t.clientX - touchStart.x, dy = t.clientY - touchStart.y;
    touchStart = null;
    if (Math.abs(dx) < 24 && Math.abs(dy) < 24) return;
    var dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
    handleDir(dir);
  }, { passive: true });

  document.addEventListener('keydown', function (e) {
    var map = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right' };
    if (map[e.key]) { e.preventDefault(); handleDir(map[e.key]); }
  });

  els.startBtn.addEventListener('click', startGame);
  els.againBtn.addEventListener('click', startGame);
  els.langToggle.addEventListener('click', function () {
    g.lang = g.lang === 'ru' ? 'en' : 'ru';
    writeLang(g.lang);
    applyLang();
  });

  g.best = readBest();
  g.lang = readLang();
  buildZones();
  buildLegend();
  buildLives();
  applyLang();
  els.footBest.textContent = g.best;
})();
</script>
</body>
</html>
